# Builds, gates and publishes a weekly Syrinx preview, then updates syrinxapp.dev (owner, 2026-10-13).
name: Weekly preview release

on:
  schedule:
    # Thursday 10:00 New York time. GitHub schedules in UTC, so both offsets are listed and
    # the plan job keeps only the one that matches daylight saving on the day.
    - cron: "0 14 * * 4" # 10:00 EDT
    - cron: "0 15 * * 4" # 10:00 EST
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if main has no new commits since the last preview"
        type: boolean
        default: false

concurrency:
  group: weekly-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The release key lives in the runner's key storage under this name for one job only (#55).
  KEY_NAME: syrinx-release-${{ github.run_id }}-${{ github.run_attempt }}
  # Each statement expires this many days after signing; the weekly re-sign renews it.
  STATEMENT_DAYS: 30

jobs:
  plan:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      previous_tag: ${{ steps.decide.outputs.previous_tag }}
      source: ${{ steps.decide.outputs.source }}
      public: ${{ steps.decide.outputs.public }}
      resign: ${{ steps.decide.outputs.resign }}
      latest_tag: ${{ steps.decide.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: decide
        name: Pick the version, or skip a quiet week
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ inputs.force }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/plan-release.sh

  release:
    name: Gate, package and publish the GitHub release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
      SOURCE: ${{ needs.plan.outputs.source }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      asset: ${{ steps.package.outputs.asset }}
      sha256: ${{ steps.package.outputs.sha256 }}
      size: ${{ steps.package.outputs.size }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust

      - name: Make the release commit
        shell: bash
        run: .github/scripts/set-version.sh "$VERSION"

      - name: Run the gate
        id: gate
        shell: bash
        run: .github/scripts/run-gate.sh

      # A test that crashes the process hides its own name; one at a time, the last line names it.
      - name: On a test crash, rerun the app's tests one at a time
        if: failure() && steps.gate.outputs.crashed == 'true'
        shell: bash
        run: cargo test --workspace --bin syrinx --profile local --offline --locked -- --test-threads=1 2>&1 | tee target/one-at-a-time.log | tail -n 60

      # A native crash has no Rust message; the debugger's call stack names the failing function.
      - name: On a test crash, print the crashing test's native call stack
        if: failure() && steps.gate.outputs.crashed == 'true'
        shell: bash
        run: .github/scripts/native-stack.sh target/one-at-a-time.log

      - id: package
        name: Build the portable package
        shell: bash
        run: .github/scripts/package-release.sh "$VERSION"

      - id: signing
        name: Check that this run can sign the update
        shell: bash
        env:
          HAS_RELEASE_KEY: ${{ secrets.SYRINX_RELEASE_KEY != '' }}
        run: .github/scripts/signing-ready.sh

      # From here to the deletion below, the key exists in this runner's key storage, not
      # exportable; the secret reaches the tool only through its environment and is never printed.
      - name: Import the release key for this job
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          SYRINX_RELEASE_KEY: ${{ secrets.SYRINX_RELEASE_KEY }}
        run: cargo xtask import-release-key --key "$KEY_NAME" --from-env SYRINX_RELEASE_KEY

      - name: Sign the update and lay out its host files
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: .github/scripts/sign-update.sh "target/package/${{ steps.package.outputs.folder }}" target/update-site include

      - name: Delete the release key
        if: always() && steps.signing.outputs.ready == 'true'
        shell: bash
        run: cargo xtask delete-release-key --key "$KEY_NAME"

      - name: Capture screenshots on synthetic data
        shell: pwsh
        run: ./.github/scripts/capture-screenshots.ps1 -Executable target/local/syrinx.exe -OutputFolder target/screenshots

      - name: Write release notes
        shell: bash
        run: .github/scripts/release-notes.sh "$PREVIOUS_TAG" "$SOURCE" "$VERSION" "${{ github.repository }}" > target/release-notes.md

      - name: Tag and publish the GitHub release
        shell: bash
        run: |
          # An annotated tag needs a tagger; the runner has no git identity of its own.
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$TAG" -m "Syrinx $VERSION preview" -m "Source: $SOURCE"
          git push origin "refs/tags/$TAG"
          # A signed run also attaches the signed update files, which a quiet week re-signs.
          signed=()
          if [ "${{ steps.signing.outputs.ready }}" = "true" ]; then
            folder="target/package/${{ steps.package.outputs.folder }}"
            signed=("$folder/manifest" "$folder/manifest.sig" "$folder/latest" "$folder/latest.sig")
          fi
          gh release create "$TAG" \
            "target/package/${{ steps.package.outputs.asset }}" \
            "target/package/${{ steps.package.outputs.zip }}" target/package/SHA256SUMS.txt \
            ${signed[@]+"${signed[@]}"} \
            --prerelease --title "Syrinx $VERSION preview" --notes-file target/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: site-inputs
          path: |
            target/release-notes.md
            target/screenshots/
          if-no-files-found: error

      # The host's updates/v1/ files; they stay a workflow artifact while the site push is skipped.
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: update-site
          path: target/update-site/
          if-no-files-found: error

  resign:
    name: Re-sign the latest statement in a quiet week
    needs: plan
    if: needs.plan.outputs.resign == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.latest_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The released source holds the keys that release's installed copies trust.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.latest_tag }}

      - id: fetch
        name: Fetch the released manifest and its last statement
        shell: bash
        run: .github/scripts/fetch-signed-release.sh "$TAG" target/resign

      - uses: ./.github/actions/setup-rust
        if: steps.fetch.outputs.found == 'true'

      - id: signing
        name: Check that this run can sign the statement
        if: steps.fetch.outputs.found == 'true'
        shell: bash
        env:
          HAS_RELEASE_KEY: ${{ secrets.SYRINX_RELEASE_KEY != '' }}
        run: .github/scripts/signing-ready.sh

      - name: Import the release key for this job
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          SYRINX_RELEASE_KEY: ${{ secrets.SYRINX_RELEASE_KEY }}
        run: cargo xtask import-release-key --key "$KEY_NAME" --from-env SYRINX_RELEASE_KEY

      - name: Sign a fresh statement and lay out its host files
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: .github/scripts/sign-update.sh target/resign target/update-site omit

      - name: Delete the release key
        if: always() && steps.signing.outputs.ready == 'true'
        shell: bash
        run: cargo xtask delete-release-key --key "$KEY_NAME"

      - name: Replace the statement on the GitHub release
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: gh release upload "$TAG" target/resign/latest target/resign/latest.sig --clobber

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: update-site
          path: target/update-site/
          if-no-files-found: error

  site:
    name: Publish the release on syrinxapp.dev
    needs: [plan, release]
    # Visitors cannot download from a private repository, so the site waits until it is public.
    if: needs.plan.outputs.public == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Fledge-Software/syrinx-public-site
          ref: main
          token: ${{ secrets.SITE_REPO_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: site-inputs
          path: ${{ runner.temp }}/site-inputs

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Write the release into the site and check it builds
        env:
          INPUTS: ${{ runner.temp }}/site-inputs
          VERSION: ${{ needs.plan.outputs.version }}
          ASSET: ${{ needs.release.outputs.asset }}
          RELEASES: https://github.com/${{ github.repository }}/releases
        run: |
          pnpm install --frozen-lockfile
          node scripts/publish-release.mjs \
            --version "$VERSION" \
            --date "$(TZ=America/New_York date +%F)" \
            --url "$RELEASES/tag/v$VERSION" \
            --download "$RELEASES/download/v$VERSION/$ASSET" \
            --sha256 "${{ needs.release.outputs.sha256 }}" \
            --size "${{ needs.release.outputs.size }}" \
            --notes "$INPUTS/release-notes.md" \
            --screenshots "$INPUTS/screenshots"
          pnpm build

      - name: Push to the site's main branch (Vercel deploys it)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/release.json src/content/releases src/assets/screenshots
          git commit -m "Publish Syrinx $VERSION preview" -m "Written by the weekly release workflow in Fledge-Software/Syrinx-app."
          git push origin HEAD:main
