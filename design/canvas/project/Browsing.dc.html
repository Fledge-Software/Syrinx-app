<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Syrinx browsing a web page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
</style>
</helmet>
<div style="position: relative; isolation: isolate; width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: {{k.ground}}; color: {{k.text}}; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; overflow: hidden">

<!-- window material: stands in for what the OS draws behind a transparent window -->
<sc-if value="{{k.material}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; z-index: -1; background: {{k.materialBg}}; backdrop-filter: {{k.materialBlur}}"></div>
</sc-if>
<sc-if value="{{k.grain}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="1440" height="900" style="position: absolute; left: 0; top: 0; z-index: -1; opacity: 0.09; pointer-events: none"><filter id="syrinx-grain-web"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="1440" height="900" filter="url(#syrinx-grain-web)"></rect></svg>
</sc-if>

<sc-if value="{{expanded}}" hint-placeholder-val="{{ true }}">
<dc-import name="Sidebar" screen="web" theme="{{theme}}" embedded="{{yes}}" accent="{{accent}}" hint-size="264px,900px" style="width: 264px; height: 900px"></dc-import>
</sc-if>

<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">

<!-- title bar; with the sidebar hidden it carries navigation and the address -->
<div style="height: 36px; flex-shrink: 0; box-sizing: border-box; padding-left: 8px; display: flex; align-items: center; gap: 2px; color: {{k.icon}}">
<sc-if value="{{collapsed}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 2px">
<button aria-label="Show sidebar" title="Show sidebar (Ctrl S)" style="width: 30px; height: 30px; border: 0; padding: 0; border-radius: 8px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg></button>
<button aria-label="Back" style="width: 30px; height: 30px; border: 0; padding: 0; border-radius: 8px; background: transparent; color: {{k.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button aria-label="Forward" disabled="{{yes}}" style="width: 30px; height: 30px; border: 0; padding: 0; border-radius: 8px; background: transparent; color: {{k.disabled}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<button aria-label="Reload" style="width: 30px; height: 30px; border: 0; padding: 0; border-radius: 8px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 11-2.3-5.7M20 4v5h-5"></path></svg></button>
<button style="margin-left: 6px; width: 340px; height: 28px; box-sizing: border-box; border: 0; border-radius: 8px; background: {{k.field}}; box-shadow: {{k.fieldShadow}}; padding: 0 6px 0 10px; display: flex; align-items: center; gap: 8px; color: {{k.text}}; font-size: 12.5px; text-align: left; cursor: text">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{k.text3}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
<span style="flex-grow: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">docs.example.com<span style="color: {{k.text3}}">/webview</span></span>
<span style="font-size: 11px; font-weight: 500; line-height: 16px; color: {{k.iconDim}}; border: 1px solid {{k.key}}; border-bottom-width: 2px; border-radius: 5px; padding: 0 5px">Ctrl K</span>
</button>
</div>
</sc-if>
<span style="flex-grow: 1"></span>
<button aria-label="Downloads" title="Downloads (Ctrl J)" style="width: 32px; height: 30px; border: 0; padding: 0; border-radius: 8px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"></path></svg></button>
<button aria-label="Syrinx menu" style="width: 32px; height: 30px; border: 0; padding: 0; border-radius: 8px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>
<span style="width: 8px"></span>
<button aria-label="Minimize" style="width: 46px; height: 36px; border: 0; padding: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16"></path></svg></button>
<button aria-label="Maximize" style="width: 46px; height: 36px; border: 0; padding: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"></rect></svg></button>
<button aria-label="Close window" style="width: 46px; height: 36px; border: 0; padding: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
</div>

<!-- page card: a web view, always opaque. The page below is a stand-in for third-party content. -->
<main aria-label="Webview reference" style="flex-grow: 1; min-height: 0; margin: {{cardMargin}}; box-sizing: border-box; border-radius: 12px; background: #FFFFFF; overflow: hidden; display: flex; flex-direction: column; color: #1C1D21; box-shadow: {{k.webShadow}}">

<div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 32px; border-bottom: 1px solid #ECECEF">
<span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 7px; background: #D5D7DE"></span><span style="font-size: 15px; font-weight: 600">Example Docs</span></span>
<span aria-hidden="true" style="display: flex; align-items: center; gap: 22px"><span style="width: 56px; height: 8px; border-radius: 4px; background: #E2E3E8"></span><span style="width: 44px; height: 8px; border-radius: 4px; background: #E2E3E8"></span><span style="width: 62px; height: 8px; border-radius: 4px; background: #E2E3E8"></span><span style="width: 40px; height: 8px; border-radius: 4px; background: #E2E3E8"></span></span>
<span aria-hidden="true" style="margin-left: auto; width: 220px; height: 32px; border-radius: 8px; background: #F2F3F5"></span>
</div>

<div aria-hidden="true" style="flex-grow: 1; min-height: 0; display: flex">
<div style="width: 236px; flex-shrink: 0; box-sizing: border-box; padding: 28px 24px; border-right: 1px solid #F0F0F3; display: flex; flex-direction: column; gap: 16px">
<span style="width: 50%; height: 8px; border-radius: 4px; background: #CDD0D7"></span>
<span style="width: 78%; height: 8px; border-radius: 4px; background: #E6E7EB"></span>
<span style="width: 64%; height: 8px; border-radius: 4px; background: #E6E7EB"></span>
<span style="width: 84%; height: 24px; margin: -4px 0; border-radius: 6px; background: #EEF0F4"></span>
<span style="width: 70%; height: 8px; border-radius: 4px; background: #E6E7EB"></span>
<span style="width: 58%; height: 8px; border-radius: 4px; background: #E6E7EB"></span>
<span style="width: 46%; height: 8px; margin-top: 12px; border-radius: 4px; background: #CDD0D7"></span>
<span style="width: 74%; height: 8px; border-radius: 4px; background: #E6E7EB"></span>
<span style="width: 62%; height: 8px; border-radius: 4px; background: #E6E7EB"></span>
<span style="width: 80%; height: 8px; border-radius: 4px; background: #E6E7EB"></span>
</div>

<div style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 40px 56px; display: flex; flex-direction: column; gap: 16px">
<span style="display: flex; gap: 10px"><span style="width: 52px; height: 8px; border-radius: 4px; background: #E6E7EB"></span><span style="width: 72px; height: 8px; border-radius: 4px; background: #E6E7EB"></span></span>
<span style="margin-top: 4px; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; color: #1C1D21">Webview reference</span>
<span style="width: 100%; height: 10px; border-radius: 5px; background: #E3E4E9"></span>
<span style="width: 94%; height: 10px; border-radius: 5px; background: #E3E4E9"></span>
<span style="width: 68%; height: 10px; border-radius: 5px; background: #E3E4E9"></span>
<span style="margin-top: 8px; box-sizing: border-box; border-radius: 10px; background: #1D1E23; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px">
<span style="width: 42%; height: 8px; border-radius: 4px; background: #4A4D57"></span>
<span style="width: 66%; height: 8px; margin-left: 24px; border-radius: 4px; background: #3A3C45"></span>
<span style="width: 54%; height: 8px; margin-left: 24px; border-radius: 4px; background: #3A3C45"></span>
<span style="width: 18%; height: 8px; border-radius: 4px; background: #4A4D57"></span>
</span>
<span style="margin-top: 14px; width: 34%; height: 14px; border-radius: 7px; background: #CDD0D7"></span>
<span style="width: 100%; height: 10px; border-radius: 5px; background: #E3E4E9"></span>
<span style="width: 97%; height: 10px; border-radius: 5px; background: #E3E4E9"></span>
<span style="width: 88%; height: 10px; border-radius: 5px; background: #E3E4E9"></span>
<span style="width: 52%; height: 10px; border-radius: 5px; background: #E3E4E9"></span>
</div>

<div style="width: 200px; flex-shrink: 0; box-sizing: border-box; padding: 40px 24px 0 0; display: flex; flex-direction: column; gap: 12px">
<span style="width: 50%; height: 8px; border-radius: 4px; background: #CDD0D7"></span>
<span style="width: 80%; height: 8px; border-radius: 4px; background: #E6E7EB"></span>
<span style="width: 66%; height: 8px; border-radius: 4px; background: #E6E7EB"></span>
<span style="width: 74%; height: 8px; border-radius: 4px; background: #E6E7EB"></span>
</div>
</div>
</main>
</div>

<!-- hover peek: pointing at the left edge slides the hidden sidebar in over the page, without resizing it -->
<sc-if value="{{peek}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; z-index: 5; width: 264px; height: 900px; border-radius: 0 12px 12px 0; overflow: hidden; border-right: 1px solid {{k.panelLine}}; box-shadow: {{peekShadow}}">
<dc-import name="Sidebar" screen="web" theme="{{theme}}" accent="{{accent}}" hint-size="264px,900px" style="width: 264px; height: 900px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"graphite","options":["graphite","haze","glass","tint","paper"]},"accent":{"editor":"color","default":"#FF8A65","options":["#FF8A65","#6EA8FF","#6FD3A8","#E8C16A"]},"collapsed":{"editor":"boolean","default":false},"peek":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  // Base palette tokens. The same method sits in Sidebar, Main, Palette and
  // Browsing (a .dc.html file cannot import code); change all four together.
  tokens(theme, accent) {
    const hex = /^#[0-9a-fA-F]{6}$/.test(accent || '') ? accent : '#FF8A65';
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const mx = Math.max(r, g, b);
    const mn = Math.min(r, g, b);
    const d = mx - mn;
    let hue = 0;
    if (d > 0) {
      if (mx === r) hue = ((g - b) / d) % 6;
      else if (mx === g) hue = (b - r) / d + 2;
      else hue = (r - g) / d + 4;
    }
    const h = Math.round((hue * 60 + 360) % 360);
    const lit = (mx + mn) / 2;
    const sat = d > 0 ? Math.round((d / (1 - Math.abs(2 * lit - 1))) * 100) : 0;
    const hsl = (s, l) => 'hsl(' + h + ', ' + Math.min(s, sat) + '%, ' + l + '%)';
    const darkTiles = [
      { bg: '#1E2A44', fg: '#7BA7FF' }, { bg: '#3A2420', fg: '#FF8F7A' },
      { bg: '#3A3220', fg: '#F2C55C' }, { bg: '#2A2C33', fg: '#D6D8DE' },
      { bg: '#2A2644', fg: '#A99BFF' }, { bg: '#1F3836', fg: '#5ED3C8' },
      { bg: '#38331C', fg: '#F5D547' }, { bg: '#3A2430', fg: '#F28BB0' }
    ];
    const lightTiles = [
      { bg: '#DCE6FF', fg: '#2F5BD3' }, { bg: '#FFE1DA', fg: '#B83A25' },
      { bg: '#FBEBC4', fg: '#8A5A00' }, { bg: '#E4E5EA', fg: '#3E4048' },
      { bg: '#E6E0FF', fg: '#5A43CF' }, { bg: '#D3F0EC', fg: '#0D7068' },
      { bg: '#F8EDBE', fg: '#7A6000' }, { bg: '#FADCE8', fg: '#AE2E63' }
    ];
    const darkPlug = { forgeBg: '#1E2A44', forge: '#7BA7FF', notesBg: '#2A2644', notes: '#B79AFF', fledgeBg: '#1F3A2E', fledge: '#6FD3A8', neutralBg: '#2A2C33', neutral: '#C9CBD1' };
    const lightPlug = { forgeBg: '#DCE6FF', forge: '#2F5BD3', notesBg: '#E6E0FF', notes: '#5A43CF', fledgeBg: '#D3F0E2', fledge: '#11774F', neutralBg: '#E4E5EA', neutral: '#3E4048' };
    const k = {
      ground: '#141519', grain: false, material: false, materialBg: 'transparent', materialBlur: 'none',
      text: '#ECEDF0', strong: '#FFFFFF', text2: '#C9CBD1', text2b: '#D5D7DD', text3: '#8B8E98',
      icon: '#B4B7BF', iconDim: '#A3A6AE', disabled: '#50535C', line: '#24262C',
      field: 'rgba(255,255,255,0.06)', fieldShadow: 'none',
      rowOn: 'rgba(255,255,255,0.09)', rowOnShadow: 'none',
      key: '#383B43', dash: '#43464F', dash2: '#363941',
      badgeText: '#1F120D', badgeRing: '#141519',
      card: '#0D0E11', cardLine: '#23252B', cardShadow: 'none', cardRing: '#0D0E11',
      surf: '#15161B', surfLine: '#24262C', surfShadow: 'none',
      pill: '#17181D', pillLine: '#2C2F36', pillShadow: '0 12px 32px rgba(0,0,0,0.35)',
      chipLine: '#2C2F36', chipOn: 'rgba(255,255,255,0.11)',
      panel: '#1B1C21', panelLine: '#31343C', panelSide: '#17181D', panelDiv: '#282B32',
      panelShadow: '0 34px 90px rgba(0,0,0,0.6)', input: '#101115', inputLine: '#2C2F36',
      scrim: 'rgba(6,7,9,0.62)',
      webShadow: '0 0 0 1px rgba(0,0,0,0.55), 0 10px 30px rgba(0,0,0,0.3)',
      tiles: darkTiles, plug: darkPlug,
      ink: hex, soft: hex + '26', softLine: hex + '8C', ring: hex + '33'
    };
    if (theme === 'haze') {
      Object.assign(k, {
        ground: 'linear-gradient(rgba(26,27,32,0.74), rgba(26,27,32,0.74)), radial-gradient(60% 70% at 10% 15%, #3F52AE 0%, rgba(63,82,174,0) 70%), radial-gradient(55% 60% at 90% 5%, #6B3F94 0%, rgba(107,63,148,0) 70%), radial-gradient(60% 65% at 80% 95%, #1D6F6A 0%, rgba(29,111,106,0) 70%), radial-gradient(50% 55% at 15% 100%, #9C5637 0%, rgba(156,86,55,0) 70%), #1A1F35',
        text: '#EFF0F4', text2: '#D3D5DC', text2b: '#DCDEE4', text3: '#A3A6B0',
        icon: '#C0C3CB', iconDim: '#AFB2BC', disabled: 'rgba(255,255,255,0.28)', line: 'rgba(255,255,255,0.09)',
        field: 'rgba(255,255,255,0.07)', rowOn: 'rgba(255,255,255,0.11)',
        key: 'rgba(255,255,255,0.2)', dash: 'rgba(255,255,255,0.26)', dash2: 'rgba(255,255,255,0.2)',
        badgeRing: '#262833',
        card: 'rgba(10,11,14,0.5)', cardLine: 'rgba(255,255,255,0.08)', cardRing: '#16171C',
        surf: 'rgba(255,255,255,0.045)', surfLine: 'rgba(255,255,255,0.08)',
        pill: 'rgba(255,255,255,0.06)', pillLine: 'rgba(255,255,255,0.12)', pillShadow: '0 12px 32px rgba(0,0,0,0.3)',
        chipLine: 'rgba(255,255,255,0.14)', chipOn: 'rgba(255,255,255,0.14)',
        panel: '#202127', panelLine: 'rgba(255,255,255,0.12)', panelSide: '#1B1C21', panelDiv: 'rgba(255,255,255,0.08)',
        input: 'rgba(0,0,0,0.28)', inputLine: 'rgba(255,255,255,0.12)', scrim: 'rgba(6,7,10,0.5)',
        webShadow: '0 0 0 1px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.3)'
      });
    } else if (theme === 'glass') {
      const edge = 'inset 0 1px 0 rgba(255,255,255,0.24), inset 0 0 0 1px rgba(255,255,255,0.07)';
      Object.assign(k, {
        ground: 'radial-gradient(circle 230px at 16% 20%, #4A62D6 0%, #4A62D6 98%, rgba(74,98,214,0) 100%), radial-gradient(circle 170px at 80% 26%, #9446B0 0%, #9446B0 98%, rgba(148,70,176,0) 100%), radial-gradient(circle 280px at 64% 92%, #C4623B 0%, #C4623B 98%, rgba(196,98,59,0) 100%), radial-gradient(circle 190px at 6% 90%, #23948A 0%, #23948A 98%, rgba(35,148,138,0) 100%), linear-gradient(160deg, #1B2550 0%, #2A1838 55%, #13252B 100%)',
        material: true, materialBg: 'rgba(16,17,24,0.46)', materialBlur: 'blur(30px) saturate(1.6)',
        swatch: 'linear-gradient(rgba(16,17,24,0.3), rgba(16,17,24,0.3)), linear-gradient(135deg, #4A62D6 0%, #9446B0 48%, #C4623B 100%)',
        text: '#F4F5F8', text2: '#E0E2E8', text2b: '#E6E8ED', text3: '#BCBFCA',
        icon: '#D0D3DA', iconDim: '#C2C5CE', disabled: 'rgba(255,255,255,0.32)', line: 'rgba(255,255,255,0.14)',
        field: 'rgba(255,255,255,0.10)', fieldShadow: edge,
        rowOn: 'rgba(255,255,255,0.16)', rowOnShadow: edge,
        key: 'rgba(255,255,255,0.28)', dash: 'rgba(255,255,255,0.32)', dash2: 'rgba(255,255,255,0.26)',
        badgeRing: '#2B2E44',
        card: 'rgba(255,255,255,0.05)', cardLine: 'rgba(255,255,255,0.16)', cardShadow: 'inset 0 1px 0 rgba(255,255,255,0.18)', cardRing: '#2B2E44',
        surf: 'rgba(255,255,255,0.08)', surfLine: 'rgba(255,255,255,0.16)', surfShadow: edge + ', 0 10px 28px rgba(0,0,0,0.18)',
        pill: 'rgba(255,255,255,0.10)', pillLine: 'rgba(255,255,255,0.22)', pillShadow: edge + ', 0 14px 36px rgba(0,0,0,0.25)',
        chipLine: 'rgba(255,255,255,0.18)', chipOn: 'rgba(255,255,255,0.18)',
        panel: 'rgba(28,30,42,0.94)', panelLine: 'rgba(255,255,255,0.16)', panelSide: 'rgba(0,0,0,0.18)', panelDiv: 'rgba(255,255,255,0.09)',
        panelShadow: 'inset 0 1px 0 rgba(255,255,255,0.14), 0 34px 90px rgba(0,0,0,0.5)',
        input: 'rgba(0,0,0,0.28)', inputLine: 'rgba(255,255,255,0.14)', scrim: 'rgba(6,7,12,0.42)',
        webShadow: '0 0 0 1px rgba(255,255,255,0.10), 0 16px 44px rgba(0,0,0,0.35)',
        tiles: darkTiles.map((t) => ({ bg: t.bg + 'C7', fg: t.fg }))
      });
    } else if (theme === 'tint') {
      Object.assign(k, {
        ground: 'linear-gradient(155deg, ' + hsl(34, 15) + ' 0%, ' + hsl(24, 9) + ' 55%, ' + hsl(20, 6) + ' 100%)',
        grain: true,
        text: hsl(18, 95), text2: hsl(12, 83), text2b: hsl(12, 87), text3: hsl(10, 66),
        icon: hsl(10, 76), iconDim: hsl(9, 70), disabled: hsl(10, 32), line: 'rgba(255,255,255,0.08)',
        field: 'rgba(255,255,255,0.07)', rowOn: 'rgba(255,255,255,0.11)',
        key: 'rgba(255,255,255,0.18)', dash: 'rgba(255,255,255,0.26)', dash2: 'rgba(255,255,255,0.18)',
        badgeRing: hsl(34, 15),
        card: hsl(22, 6), cardLine: hsl(18, 14), cardRing: hsl(22, 6),
        surf: hsl(20, 9), surfLine: hsl(16, 15),
        pill: hsl(20, 10), pillLine: hsl(16, 19),
        chipLine: hsl(14, 22), chipOn: 'rgba(255,255,255,0.12)',
        panel: hsl(18, 11), panelLine: hsl(14, 21), panelSide: hsl(18, 9), panelDiv: hsl(14, 16),
        input: hsl(20, 6), inputLine: hsl(14, 21), scrim: 'rgba(6,5,5,0.6)'
      });
    } else if (theme === 'paper') {
      Object.assign(k, {
        ground: '#E9EAEE',
        text: '#1B1C21', strong: '#0E0F12', text2: '#3A3C44', text2b: '#2B2D34', text3: '#5E616A',
        icon: '#4A4D56', iconDim: '#5E616A', disabled: '#B1B3BA', line: '#D5D7DD',
        field: 'rgba(20,22,30,0.06)', rowOn: '#FFFFFF', rowOnShadow: '0 1px 2px rgba(20,22,30,0.10)',
        key: '#C3C5CC', dash: '#B5B8C0', dash2: '#C3C5CC',
        badgeRing: '#E9EAEE',
        card: '#F7F7F9', cardLine: '#DADCE2', cardRing: '#F7F7F9',
        surf: '#FFFFFF', surfLine: '#E0E2E7', surfShadow: '0 1px 2px rgba(20,22,30,0.05)',
        pill: '#FFFFFF', pillLine: '#D7D9DF', pillShadow: '0 8px 24px rgba(20,22,30,0.08)',
        chipLine: '#D5D7DD', chipOn: 'rgba(20,22,30,0.08)',
        panel: '#FFFFFF', panelLine: '#D5D7DD', panelSide: '#F5F6F8', panelDiv: '#E4E5EA',
        panelShadow: '0 30px 80px rgba(20,22,30,0.22)', input: '#FFFFFF', inputLine: '#D0D2D9',
        scrim: 'rgba(20,22,30,0.26)',
        webShadow: '0 0 0 1px rgba(20,22,30,0.10), 0 6px 20px rgba(20,22,30,0.08)',
        tiles: lightTiles, plug: lightPlug,
        ink: 'hsl(' + h + ', ' + Math.min(85, sat) + '%, 36%)', soft: hex + '24'
      });
    }
    if (!k.swatch) k.swatch = k.ground;
    return k;
  }

  renderVals() {
    const acc = this.props.accent ?? '#FF8A65';
    const theme = this.props.theme ?? 'graphite';
    // peek: the sidebar is hidden and the pointer is at the left edge, so it
    // floats over the page; this works the same way on every kind of tab.
    const peek = !!this.props.peek;
    const collapsed = !!this.props.collapsed || peek;
    return {
      k: this.tokens(theme, acc),
      theme: theme,
      accent: acc,
      peek: peek,
      peekShadow: theme === 'paper' ? '16px 0 40px rgba(20,22,30,0.18)' : '16px 0 48px rgba(0,0,0,0.5)',
      collapsed: collapsed,
      expanded: !collapsed,
      yes: true,
      cardMargin: collapsed ? '0 8px 8px 8px' : '0 8px 8px 0'
    };
  }
}
</script>
</body>
</html>
