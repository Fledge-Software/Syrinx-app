<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas command palette</title>
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">

button,input{font:inherit;color:inherit}

<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: {{k.ground}}; color: {{k.text}}; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px">

<dc-import name="Main" theme="{{theme}}" accent="{{accent}}" hint-size="1440px,900px" style="width: 1440px; height: 900px"></dc-import>

<!-- scrim -->
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: {{k.scrim}}"></div>

<!-- command palette: near-opaque in every palette, because over a web page there is nothing it could blur -->
<section aria-label="Command palette" style="position: absolute; left: 280px; top: 72px; width: 880px; box-sizing: border-box; border-radius: 18px; background: {{k.panel}}; border: 1px solid {{k.panelLine}}; box-shadow: {{k.panelShadow}}; overflow: hidden; display: flex; flex-direction: column">

<!-- query -->

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.text3}}" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input aria-label="Search, enter an address or run a command" defaultValue="fled" style="flex-grow: 1; min-width: 0; height: 40px; border: 0; padding: 0; outline: none; background: transparent; color: {{k.strong}}; font-size: 19px">
<span style="font-size: 11px; font-weight: 500; line-height: 16px; color: {{k.iconDim}}; border: 1px solid {{k.key}}; border-bottom-width: 2px; border-radius: 5px; padding: 0 6px">Esc</span>
</div>

<!-- scope chips -->
<div style="padding: 12px 20px; display: flex; align-items: center; gap: 8px; font-size: 12px">
<button aria-pressed="true" style="height: 26px; padding: 0 12px; border: 1px solid transparent; border-radius: 13px; background: {{k.chipOn}}; color: {{k.strong}}; font-weight: 500; display: flex; align-items: center; gap: 7px; cursor: pointer">Everything<span style="color: {{k.text2}}; font-weight: 400">12</span></button>
<button aria-pressed="false" style="height: 26px; padding: 0 12px; border: 1px solid {{k.chipLine}}; border-radius: 13px; background: transparent; color: {{k.text2}}; display: flex; align-items: center; gap: 7px; cursor: pointer">Tabs<span style="color: {{k.text3}}">2</span></button>
<button aria-pressed="false" style="height: 26px; padding: 0 12px; border: 1px solid {{k.chipLine}}; border-radius: 13px; background: transparent; color: {{k.text2}}; display: flex; align-items: center; gap: 7px; cursor: pointer">Plugin actions<span style="color: {{k.text3}}">3</span></button>
<button aria-pressed="false" style="height: 26px; padding: 0 12px; border: 1px solid {{k.chipLine}}; border-radius: 13px; background: transparent; color: {{k.text2}}; display: flex; align-items: center; gap: 7px; cursor: pointer">Bookmarks<span style="color: {{k.text3}}">1</span></button>
<button aria-pressed="false" style="height: 26px; padding: 0 12px; border: 1px solid {{k.chipLine}}; border-radius: 13px; background: transparent; color: {{k.text2}}; display: flex; align-items: center; gap: 7px; cursor: pointer">History<span style="color: {{k.text3}}">6</span></button>
</div>

<div style="display: flex; height: 452px; border-top: 1px solid {{k.panelDiv}}">

<!-- results -->

<div style="margin-top: 4px; height: 28px; padding: 0 4px 0 10px; display: flex; align-items: center">

<button style="height: 38px; width: 100%; flex-shrink: 0; box-sizing: border-box; border: 0; border-radius: 10px; background: transparent; padding: 0 10px; display: flex; align-items: center; gap: 12px; color: {{k.text2b}}; font-size: 13.5px; text-align: left; cursor: pointer">

<div style="flex-shrink: 0; padding: 6px 10px; border-top: 1px solid {{k.panelDiv}}">
<button style="height: 40px; width: 100%; box-sizing: border-box; border: 0; border-radius: 10px; background: transparent; padding: 0 10px; display: flex; align-items: center; gap: 12px; color: {{k.text2b}}; font-size: 13.5px; text-align: left; cursor: pointer">
<span aria-hidden="true" style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 7px; background: {{k.plug.neutralBg}}; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{k.plug.neutral}}" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path></svg></span>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"graphite","options":["graphite","haze","glass","tint","paper"]},"accent":{"editor":"color","default":"#FF8A65","options":["#FF8A65","#6EA8FF","#6FD3A8","#E8C16A"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  // Base palette tokens. The same method sits in Sidebar, Main, Palette and
  // Browsing (a .dc.html file cannot import code); change all four together.
  tokens(theme, accent) {
    const hex = /^#[0-9a-fA-F]{6}$/.test(accent || '') ? accent : '#FF8A65';
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const mx = Math.max(r, g, b);
    const mn = Math.min(r, g, b);
    const d = mx - mn;
    let hue = 0;
    if (d > 0) {
      if (mx === r) hue = ((g - b) / d) % 6;
      else if (mx === g) hue = (b - r) / d + 2;
      else hue = (r - g) / d + 4;
    }
    const h = Math.round((hue * 60 + 360) % 360);
    const lit = (mx + mn) / 2;
    const sat = d > 0 ? Math.round((d / (1 - Math.abs(2 * lit - 1))) * 100) : 0;
    const hsl = (s, l) => 'hsl(' + h + ', ' + Math.min(s, sat) + '%, ' + l + '%)';
    const darkTiles = [
      { bg: '#1E2A44', fg: '#7BA7FF' }, { bg: '#3A2420', fg: '#FF8F7A' },
      { bg: '#3A3220', fg: '#F2C55C' }, { bg: '#2A2C33', fg: '#D6D8DE' },
      { bg: '#2A2644', fg: '#A99BFF' }, { bg: '#1F3836', fg: '#5ED3C8' },
      { bg: '#38331C', fg: '#F5D547' }, { bg: '#3A2430', fg: '#F28BB0' }
    ];
    const lightTiles = [
      { bg: '#DCE6FF', fg: '#2F5BD3' }, { bg: '#FFE1DA', fg: '#B83A25' },
      { bg: '#FBEBC4', fg: '#8A5A00' }, { bg: '#E4E5EA', fg: '#3E4048' },
      { bg: '#E6E0FF', fg: '#5A43CF' }, { bg: '#D3F0EC', fg: '#0D7068' },
      { bg: '#F8EDBE', fg: '#7A6000' }, { bg: '#FADCE8', fg: '#AE2E63' }
    ];
    const darkPlug = { forgeBg: '#1E2A44', forge: '#7BA7FF', notesBg: '#2A2644', notes: '#B79AFF', fledgeBg: '#1F3A2E', fledge: '#6FD3A8', neutralBg: '#2A2C33', neutral: '#C9CBD1' };
    const lightPlug = { forgeBg: '#DCE6FF', forge: '#2F5BD3', notesBg: '#E6E0FF', notes: '#5A43CF', fledgeBg: '#D3F0E2', fledge: '#11774F', neutralBg: '#E4E5EA', neutral: '#3E4048' };
    const k = {
      ground: '#141519', grain: false, material: false, materialBg: 'transparent', materialBlur: 'none',
