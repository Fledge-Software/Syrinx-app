# Confines the Windows storage-path checks to the platform boundary.
[package]
name = "syrinx-platform"
description = "Syrinx's Windows platform services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
syrinx-core = { path = "../syrinx-core" }
syrinx-store = { path = "../syrinx-store" }
windows = { workspace = true, features = ["Storage_Provider", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
wry.workspace = true
webview2-com.workspace = true
raw-window-handle.workspace = true
futures.workspace = true
# P1-25 parses DevTools snapshots; the audited pin is already compiled into syrinx-app.
serde_json.workspace = true

[dev-dependencies]
rusqlite.workspace = true

# Lets the gate run and lint the native fixture's unit tests; they never start WebView2.
[[example]]
name = "page_close"
test = true

[lints]
workspace = true
