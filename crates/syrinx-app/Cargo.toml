[package]
name = "syrinx-app"
description = "Syrinx's Windows application entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# `cargo syrinx` and the gate's smoke run start the browser, not the setup program.
default-run = "syrinx"

# Name the executable after the product, as Task Manager and the registry show it.
[[bin]]
name = "syrinx"
path = "src/main.rs"

# Installs or upgrades Syrinx for this Windows user from the package it carries.
[[bin]]
name = "syrinx-setup"
path = "src/bin/syrinx-setup.rs"

[dependencies]
syrinx-core = { path = "../syrinx-core" }
syrinx-platform = { path = "../syrinx-platform" }
syrinx-search = { path = "../syrinx-search" }
syrinx-store = { path = "../syrinx-store" }
syrinx-ui = { path = "../syrinx-ui" }
# P1-39b's installer; never with `release-tool`, which `cargo xtask check-deps` refuses.
syrinx-update = { path = "../syrinx-update" }
# P1-39c's owner-pressed download from the compiled-in host; nothing else may use it.
syrinx-update-net = { path = "../syrinx-update-net" }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
futures.workspace = true
raw-window-handle.workspace = true
url.workspace = true

# GPUI draws through X11 on Linux, since wry can embed its child web views only there.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["x11"] }

# #9's survival tests hold SQLite's write lock from a second connection.
[dev-dependencies]
rusqlite.workspace = true

[features]
# Set only by `cargo xtask package`, so the installed app keeps its data apart from preview runs.
installed = []

[lints]
workspace = true
