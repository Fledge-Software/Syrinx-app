# Verifies signed update packages locally before anything is installed (P1-38).
[package]
name = "syrinx-update"
description = "Syrinx's local verifier for signed update packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]

[features]
# Opens Windows key storage to sign releases; only the release tool enables it, never Syrinx itself.
release-tool = []

# Swaps a staged update into place after Syrinx exits (P1-39b); ships in every package.
[[bin]]
name = "syrinx-apply"
path = "src/bin/syrinx-apply.rs"

[[bin]]
name = "syrinx-update-tool"
path = "src/bin/syrinx-update-tool.rs"
required-features = ["release-tool"]

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# Linux and macOS have no CNG; `ring` (Apache-2.0 AND ISC) hashes and checks signatures there.
[target.'cfg(not(windows))'.dependencies]
ring = "=0.17.14"

# `flock` and `O_NOFOLLOW` stand in for Windows' exclusive and link-refusing opens.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
