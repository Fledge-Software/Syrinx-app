# Confines the Windows storage-path checks to the platform boundary.
[package]
name = "atlas-platform"
description = "Atlas's Windows platform services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
atlas-core = { path = "../atlas-core" }
atlas-store = { path = "../atlas-store" }
windows = { workspace = true, features = ["Storage_Provider", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
wry.workspace = true
webview2-com.workspace = true
raw-window-handle.workspace = true
futures.workspace = true

[dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true
