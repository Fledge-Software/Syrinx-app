# SPDX-License-Identifier: MPL-2.0
#
# The licence policy `cargo xtask check-licences` enforces on every third-party
# package Windows compiles from Cargo.lock (#28, G4 in docs/decisions.md,
# 2026-10-26). It follows AGENTS.md, "Dependencies and licence": permissive
# licences or whole MPL-2.0 files, and no GPL. A package that offers a choice
# ("MIT OR Apache-2.0") passes when one choice is allowed; Syrinx elects that one.
# Anything else is listed below by exact name and version with the owner
# approval that covers it; a new version or a new package fails until reviewed.

allowed = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "MPL-2.0"]

# `encoding_rs 0.8.42`, `(Apache-2.0 OR MIT) AND BSD-3-Clause`, needs no entry:
# both sides are on the list above (docs/dev/wasmtime-audit.md, "Licences", 4).

# The wasmtime and Cranelift family, `Apache-2.0 WITH LLVM-exception`: 29
# lockfile entries under G1's option (b). Approved 2026-10-21 (AGENTS.md,
# "Approved narrow licence exception, 2026-10-21"); regalloc2 and
# target-lexicon by G10. The audit is docs/dev/wasmtime-audit.md, "Licences"
# and its per-crate table; wasmtime-internal-jit-debug is locked but not
# compiled on Windows. Every entry is at the version that audit recorded; a
# fresh resolution would move five cranelift crates to 0.135.8, so they are
# held at 0.135.7 until a pin bump re-audits them.

